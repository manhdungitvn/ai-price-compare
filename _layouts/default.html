<!doctype html>
<html lang="{{ page.lang | default: 'vi' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" type="image/png" sizes="128x128" href="{{ '/assets/icon.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/icon-32.png' | relative_url }}">
  <link rel="shortcut icon" href="{{ '/favicon.ico' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/icon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #0f172a; --muted: #475569; --soft: #64748b; --line: #e2e8f0; --card: #ffffff; --brand: #6366f1; --brand-2: #ec4899; --bg: #f8fafc; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; font-family: "Google Sans", "Segoe UI", system-ui, -apple-system, sans-serif; color: var(--ink); background: var(--bg); line-height: 1.55; -webkit-font-smoothing: antialiased; }
    a { color: #4f46e5; text-decoration: none; } a:hover { text-decoration: underline; }
    .nav { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; padding: 12px 24px; background: rgba(255,255,255,.85); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
    .nav img { width: 28px; height: 28px; border-radius: 8px; } .nav b { font-weight: 700; } .nav .links { margin-left: auto; display: flex; gap: 18px; font-size: 14px; font-weight: 500; }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }
    .hero { padding: 72px 0 40px; background: radial-gradient(900px 500px at 15% 0%, #eef2ff 0%, #fdf2f8 55%, #fff7ed 100%); }
    .hero .wrap { display: grid; grid-template-columns: 1.1fr 1fr; gap: 40px; align-items: center; }
    .kicker { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: #fff; color: #4f46e5; font-weight: 700; font-size: 13px; box-shadow: 0 4px 14px rgba(79,70,229,.12); }
    h1 { margin: 18px 0 12px; font-size: clamp(34px, 4.6vw, 52px); line-height: 1.08; font-weight: 800; letter-spacing: -.8px; }
    .grad { background: linear-gradient(90deg, var(--brand), var(--brand-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .lead { font-size: 19px; color: var(--muted); margin: 0 0 22px; }
    .cta { display: inline-flex; align-items: center; gap: 8px; padding: 13px 22px; border-radius: 999px; background: linear-gradient(90deg, var(--brand), var(--brand-2)); color: #fff !important; font-weight: 700; box-shadow: 0 10px 24px rgba(99,102,241,.3); }
    .cta:hover { text-decoration: none; filter: brightness(1.05); }
    .ghost { display: inline-flex; padding: 13px 20px; border-radius: 999px; background: #fff; border: 1px solid var(--line); font-weight: 600; color: var(--ink) !important; margin-left: 8px; }
    .shot { border-radius: 20px; box-shadow: 0 30px 70px rgba(15,23,42,.18); width: 100%; height: auto; }
    .shot.panel { max-width: 400px; justify-self: center; box-shadow: none; }
    section { padding: 48px 0; }
    h2 { font-size: 28px; letter-spacing: -.4px; margin: 0 0 8px; }
    .sub { color: var(--soft); margin: 0 0 24px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
    .ic { display: inline-flex; width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #eef2ff, #fce7f3); color: #4f46e5; align-items: center; justify-content: center; } .ic svg { width: 24px; height: 24px; }
    .ki { display: inline-flex; width: 18px; height: 18px; color: #ec4899; } .ki svg { width: 18px; height: 18px; } .card h3 { margin: 8px 0 6px; font-size: 16px; } .card p { margin: 0; color: var(--muted); font-size: 14px; }
    .stores { display: flex; flex-wrap: wrap; gap: 8px; } .stores span { padding: 6px 12px; border-radius: 999px; background: #fff; border: 1px solid var(--line); font-size: 13px; font-weight: 600; color: var(--muted); }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: center; } .two + .two { margin-top: 40px; }
    .privacy { background: #fff; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    footer { padding: 28px 0 40px; color: var(--soft); font-size: 13px; }
    /* Long-form pages (privacy policy) */
    .doc { max-width: 820px; margin: 0 auto; padding: 48px 24px 64px; }
    .doc h1 { font-size: 36px; } .doc h2 { font-size: 22px; margin-top: 36px; } .doc p, .doc li { color: #1e293b; font-size: 16px; }
    .doc table { width: 100%; border-collapse: collapse; font-size: 14px; display: block; overflow-x: auto; } .doc th, .doc td { text-align: left; vertical-align: top; padding: 10px 12px; border: 1px solid var(--line); } .doc th { background: #f1f5f9; }
    .doc code { background: #f1f5f9; padding: 1px 6px; border-radius: 6px; font-size: 90%; } .doc hr { border: 0; border-top: 1px solid var(--line); margin: 48px 0; }
    @media (max-width: 800px) { .hero .wrap, .two, .grid { grid-template-columns: 1fr; } .hero { padding-top: 40px; } .ghost { margin: 8px 0 0; } }
  </style>
</head>
<body>
  <nav class="nav"><img src="{{ '/assets/icon.png' | relative_url }}" alt=""><b>AI Reviewer &amp; Price Compare</b>
    <span class="links"><a href="{{ '/' | relative_url }}">Trang chủ</a><a href="{{ '/PRIVACY' | relative_url }}">Privacy</a><a href="https://github.com/manhdungitvn/ai-price-compare/issues">Hỗ trợ</a></span></nav>
  {% if page.layout_mode == 'doc' %}<main class="doc">{{ content }}</main>{% else %}{{ content }}{% endif %}
  <footer><div class="wrap">© 2026 AI Reviewer &amp; Price Compare · <a href="{{ '/PRIVACY' | relative_url }}">Privacy Policy</a> · <a href="https://github.com/manhdungitvn/ai-price-compare/issues">Support</a> · Không liên kết với sàn nào; giá có thể thay đổi — kiểm tra lại trên trang bán trước khi mua.</div></footer>
</body>
</html>
